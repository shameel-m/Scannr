<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f5f1" />
  <title>Scannr — Make a QR code</title>
  <meta name="description" content="Create and download a QR code from any link. Free, fast, and private." />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="js/app.js"></script>
</head>
<body>
  <header class="shell">
    <div class="brand"><span class="brand-mark">⌗</span> Scannr<span class="brand-dot">.</span></div>
    <div class="header-actions">
      
      <a class="header-link" href="https://github.com/YOUR-USERNAME/Scannr" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
      </a>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Toggle dark mode">
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main class="shell">
    <section class="intro">
      <div class="eyebrow"><span class="dot"></span> Free QR code generator</div>
      <h1>Your link<br><span>one scan away</span></h1>
    </section>

    <section class="workspace">
      <div class="panel">
        <form id="qrForm">
          <label for="url">Website URL</label>
          <div class="url-wrap">
            <span aria-hidden="true">↗</span>
            <input id="url" type="url" placeholder="https://yourwebsite.com" autocomplete="url" required />
            <button class="paste-btn" id="paste" type="button" aria-label="Paste link from clipboard">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
              Paste
            </button>
          </div>
          <div class="options">
            <div class="option"><label for="dark">QR colour</label><input id="dark" type="color" value="#171816" /></div>
            <div class="option"><label for="size">Size</label><select id="size"><option value="220">Small</option><option value="300" selected>Medium</option><option value="400">Large</option></select></div>
          </div>
          <button class="generate" type="submit">Generate QR code <span aria-hidden="true">↗</span></button>
          <p class="hint" id="hint" role="status"></p>
        </form>
      </div>

      <div class="panel preview">
        <h2>Your QR code will appear hear</h2>
        <p class="sub">...</p>
        <div class="qr-stage">
          <div id="qrcode" aria-live="polite">
            <div class="placeholder-content">
              <svg class="placeholder-icon" width="54" height="54" viewBox="0 0 54 54" fill="none" aria-hidden="true">
                <rect x="4" y="5" width="16" height="16" rx="2" stroke="currentColor" stroke-width="3"/>
                <rect x="34" y="5" width="16" height="16" rx="2" stroke="currentColor" stroke-width="3"/>
                <rect x="4" y="34" width="16" height="16" rx="2" stroke="currentColor" stroke-width="3"/>
                <path d="M28 7v9m0 7v7m0 5v12m7-19h8m-8 7v8m8-8v8m-8 7h8m-22-19h5m-5 7v5m5-12v5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              </svg>
              <span>Your QR code is waiting</span>
            </div>
          </div>
        </div>
        <button class="download" id="download" type="button" disabled>↓ &nbsp; Download PNG</button>
        <!-- <div class="privacy">Your link is processed in this browser.</div> -->
      </div>
    </section>

  </main>

  <footer>
    <div class="shell">
      <span>© Link to QR 2026. All rights reserved.</span>
      <span class="footer-links"><a href="mailto:shameel.mx@gmail.com">Contact</a></span>
    </div>
  </footer>
</body>
</html>
